global:
  cloudProvider: {}
  telemetry:
    tracing: {}
    logger:
      opentelemetryOptions: {}
  jobDefinitions: {}
  storage: {}
  serviceUrls: {}
  ca: {}

serviceUrls:
  jobManager: ""
  heartbeatManager: ""
  jobTracker: ""

storage:
  cleanupStorageProviders: [] # e.g. [S3, FS]
  s3:
    delete:
      batchSize: 1000
    endpointUrl: ""
    forcePathStyle: true
    secretName: ""
    sslEnabled: false
    region: ""
  fs:
    delete:
      batchSize: 1000
    internalPvc:
      enabled: false
      name: ""
      mountPath: ""
      tilesSubPath: "" # e.g. folder/tiles

mclabels:
  component: backend
  partOf: core
  owner: raster
  gisDomain: raster
  prometheus:
    enabled: true

enabled: true
replicaCount: 1
revisionHistoryLimit: 5  # Amount of revisions we keep
nodePort: 30030  # for minikube deployment only
resetOnConfigChange: false

nameOverride: ""
fullnameOverride: ""

configManagement:
  offlineMode: true
  name: 'cleaner'
  version: 'latest'
  serverUrl: 'http://localhost:8080/api'

jobDefinitions: {}

livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

podAnnotations: {}

extraVolumes: []

extraVolumeMounts: []

extraEnvVars: []

command: []
args: []
# command: [ "/bin/sh", "-c", "--" ]
# args: [ "while true; do sleep infinity; done;" ]

sidecars: []

cloudProvider:
  dockerRegistryUrl: ''
  imagePullSecretName: ''
  flavor: openshift

ca:
  secretName: ''
  path: '/usr/local/share/ca-certificates'
  key: 'ca.crt'

image:
  repository: cleaner
  # If commented, appVersion will be taken. See: _helpers.tpl
  # tag: 'latest'
  pullPolicy: IfNotPresent

server:
  port: 8080
  targetPort: 8080

telemetry:
  logger:
    level: info
    prettyPrint: false
    opentelemetryOptions:
      enabled: true
      url: http://localhost:4317
      # resourceAttributes:
      #   service.namespace: namespace
      #   deployment.environment: dev
  tracing:
    enabled: true
    # url can be overridden from global.telemetry.tracing.url
    url: http://localhost:4318/v1/traces

env:
  queue:
    heartbeatIntervalMs: 1000
    dequeueIntervalMs: 3000
  worker:
    capabilities:
      pairs:
        - job: "Ingestion_Update"
          task: "tiles-deletion"
        - job: "Delete_Layer"
          task: "tiles-deletion"
  httpRetry:
    attempts: 3
    delay: "exponential"
    shouldResetTimeout: true
  disableHttpClientLogs: false
  strategies:
    tilesDeletion:
      batchSize: 1000
      concurrency: 10

resources:
  enabled: true
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
